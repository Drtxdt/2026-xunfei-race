# ROS topics
image_topic: /usb_cam/image_raw
cmd_vel_topic: /cmd_vel
odom_topic: /odom
status_topic: /right_line_follow/status
debug_image_topic: /right_line_follow/debug_image
start_topic: /right_line_follow/start

# Startup and route. This node is dedicated to the vehicle-perspective right
# route, which corresponds to the P1 parking rectangle in the supplied map.
auto_start: true
publish_debug: true

# Track geometry. The real lane spacing is about 42 cm; this pixel value is
# used when only one border is visible.
lane_width_m: 0.42
lane_width_px_init: 230
lane_width_px_min: 150
lane_width_px_max: 320
lane_width_adapt_alpha: 0.2
enable_lane_width_adapt: false
single_line_hold_frames: 12

# Image region and white-line extraction
roi_y_start_ratio: 0.45
roi_y_end_ratio: 1.0
white_s_max: 85
white_v_min: 150
gray_white_threshold: 185
morph_kernel_size: 5
min_line_width_px: 6
min_segment_gap_px: 12
min_contour_area: 60

# Horizontal scan rows inside ROI, top to bottom.
scan_row_ratios: [0.20, 0.35, 0.50, 0.65, 0.80, 0.92]
target_row_weight_bottom: 1.5

# PID control
base_linear_speed: 0.15
min_linear_speed: 0.055
search_linear_speed: 0.035
kp: 0.0045
ki: 0.0
kd: 0.0015
max_integral: 80.0
max_angular_speed: 0.8
error_slowdown_px: 160.0

# Lost-line handling
search_angular_speed: 0.25
lost_timeout: 1.0
stop_on_lost: false

# Right-lane selection. At startup and forks, the rightmost adjacent pair is
# selected so the car does not drift into the middle lane.
fork_candidate_count: 3
fork_center_tolerance_px: 220
fork_cooldown_sec: 0.8
fork_latch_time: 0.45
right_turn_bias_px: 65
right_turn_hold_time: 1.15
right_turn_linear_speed: 0.08
startup_right_bias_duration: 1.7
startup_force_right_until_dual_frames: 8
startup_force_right_clear_nonfork_frames: 18
startup_force_right_min_duration: 3.2
startup_force_right_bias_px: 115
right_anchor_ratio: 0.72

# P1 black parking rectangle detection and stop behavior.
parking_enable_delay: 6.0
parking_roi_y_start_ratio: 0.58
parking_roi_y_end_ratio: 1.0
black_v_max: 80
black_gray_max: 75
black_s_min: 0
black_morph_kernel_size: 7
parking_min_area_ratio: 0.035
parking_min_width_ratio: 0.25
parking_min_height_ratio: 0.08
parking_max_height_ratio: 0.55
parking_min_aspect_ratio: 0.9
parking_max_aspect_ratio: 5.0
parking_min_fill_ratio: 0.45
parking_max_components: 3
parking_center_tolerance_ratio: 0.34
parking_reached_bottom_y_ratio: 0.94
parking_candidate_confirm_frames: 3
parking_reached_confirm_frames: 2
parking_release_frames: 2
parking_auto_stop: true
parking_stop_time: 1.0

# Odom creep after the black rectangle is locked. If odom is unavailable, the
# node falls back to visual bottom-edge stopping.
parking_use_odom_approach: true
parking_odom_approach_distance_m: 0.24
parking_odom_approach_speed: 0.055
parking_odom_min_trigger_frames: 3
parking_odom_timeout_sec: 8.0
parking_approach_center_alpha: 0.70
parking_center_weight: 0.55
parking_approach_max_angular_speed: 0.38
parking_approach_linear_speed_scale: 0.65
parking_final_linear_speed: 0.03
