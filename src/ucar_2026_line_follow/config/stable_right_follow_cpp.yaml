###############
# Line follow
###############
target_right_x: 145

# 速度调低，让车更稳
base_speed: 0.22          # 0.34 → 0.22
curve_speed: 0.18         # 0.27 → 0.18
search_speed: 0.12
lost_line_speed: 0.14
startup_speed: 0.45

###############
# PID
###############
# 降低比例、增加微分，抑制蛇形
kp_pos: 0.0035            # 0.0055 → 0.0035
kd_pos: 0.0025            # 0.0018 → 0.0025
kp_angle: 0.25            # 0.40 → 0.25

# 限制最大转向速度，提高平滑度
max_angular: 0.40         # 0.55 → 0.40
error_filter_alpha: 0.30  # 0.22 → 0.30（更平滑）

###############
# Curve
###############
curve_threshold: 35.0
curve_offset: 15.0
curve_gain: 0.9           # 1.2 → 0.9（弯道不冲）

###############
# Startup
###############
startup_time: 2.8

###############
# Stop line
###############
# 放宽停车线检测参数，配合 C++ 代码中的几何约束
cross_area_threshold: 48000
stop_line_min_width: 120   # 180 → 120
stop_line_max_height: 40   # 30 → 40
stop_line_min_area: 800    # 1200 → 800

###############
# Align
###############
align_speed: 0.18
align_angle_threshold: 2.0   # 如果想对齐更准，可改为 1.0
align_stop_time: 1.5         # 0.2 → 1.5（停车停 1.5 秒）
desired_angle_deg: 0.0

###############
# Final forward
###############
final_speed: 0.20
final_distance: 0.60         # 0.70 → 0.60（直走 60 厘米）

###############
# Debug
###############
show_debug: true