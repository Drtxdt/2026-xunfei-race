###############
# Right-line follow: faster + second sharp-corner delayed turn
###############
target_right_x: 125
curve_offset: 42.0

# 整体提速；弯道仍保留一定降速
base_speed: 0.36
curve_speed: 0.28
search_speed: 0.18
lost_line_speed: 0.18
startup_speed: 0.50
startup_time: 2.2

###############
# PID / steering smoothness
###############
kp_pos: 0.0034
kd_pos: 0.0024
kp_angle: 0.24
ki_pos: 0.00025
integral_clamp: 50.0
d_error_clamp: 20.0
hard_safety_margin_px: 18.0
safety_min_angular: 0.20
safety_speed_scale: 0.72
max_angular: 0.48
error_filter_alpha: 0.22
curve_threshold: 35.0
curve_gain: 0.92

###############
# Normal lost-line / first-corner correction
###############
lost_line_stop_duration: 1.1
lost_line_turn_angle_deg: 9.0
left_turn_safety_margin_px: 35.0
left_turn_extra_gain: 0.008
left_turn_max_angular: 0.70
search_right_speed: 0.14
search_right_angular: 0.18

right_turn_angle_threshold_deg: 15.0
right_turn_trigger_count: 6
right_turn_cooldown_sec: 3.0

###############
# 第二个尖锐右转：完全视觉闭环，不写死角度
# 先越过尖点约25cm（期间仍做小幅视觉修正），随后根据右边线位置和斜率自适应转向
###############
second_corner_advance_distance: 0.25
second_corner_advance_speed: 0.32
second_corner_advance_max_angular: 0.22

# 看见右线时的位置/角度双闭环
second_corner_follow_speed: 0.26
second_corner_min_speed: 0.10
second_corner_kp_pos: 0.0050
second_corner_kp_angle: 0.42
second_corner_max_angular: 0.75

# 暂时看不见右线时，逐渐扩大向右搜索，不使用固定转角
second_corner_search_speed: 0.10
second_corner_search_angular_min: 0.18
second_corner_search_angular_max: 0.62
second_corner_search_ramp_sec: 1.8

# 连续稳定若干帧后恢复正常循线
second_corner_stable_pos_px: 16.0
second_corner_stable_angle_deg: 10.0
second_corner_stable_frames: 8

###############
# Stop line
###############
cross_area_threshold: 48000
stop_line_min_width: 80
stop_line_max_height: 50
stop_line_min_area: 400
stop_line_min_fill_ratio: 0.35
stop_line_bottom_margin_ratio: 0.40

###############
# Final stop sequence
###############
align_speed: 0.18
align_angle_threshold: 2.0
align_stop_time: 0.3
desired_angle_deg: -5.0
align_angular_speed: 0.10
final_speed: 0.28
final_distance: 0.60

show_debug: true
