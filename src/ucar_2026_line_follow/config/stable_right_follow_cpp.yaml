###############
# Line follow
###############
target_right_x: 125          # 145 → 130，车更靠左，远离右线
curve_offset: 60.0           # 15 → 20，弯道额外远离右线
# 速度调低，让车更稳
base_speed: 0.22             # 0.30 → 0.22
curve_speed: 0.18            # 0.24 → 0.18
search_speed: 0.12
lost_line_speed: 0.14
startup_speed: 0.45
###############
# PID
###############
# 降低比例、增加微分，抑制蛇形，减少飘动
kp_pos: 0.0032               # 0.0040 → 0.0032
kd_pos: 0.0030               # 0.0020 → 0.0030
kp_angle: 0.25               # 0.30 → 0.25
# 限制最大转向速度，提高平滑度
max_angular: 0.40            # 0.45 → 0.40
error_filter_alpha: 0.25     # 0.18 → 0.25（滤波更强，更平滑）
###############
# Curve
###############
curve_threshold: 35.0
curve_gain: 0.9              # 1.0 → 0.9（弯道不冲）
###############
# Startup
###############
startup_time: 2.8
###############
# Lost line -> left turn (~25 deg) then search
###############
# 丢线后左转的基础角速度/时长在代码中固定为 0.6rad/s * 0.7s ≈ 24°
# 下面参数用于左转过程中"主动远离右线，防止压线"
left_turn_safety_margin_px: 40.0   # 右线像素x小于 (target_right_x - 该值) 视为过近
left_turn_extra_gain: 0.01         # 每像素过近量 -> 额外角速度增益 (rad/s per px)
left_turn_max_angular: 0.9         # 左转阶段角速度上限（含主动远离部分）
###############
# Stop line
###############
cross_area_threshold: 48000
stop_line_min_width: 80      # 120 → 80
stop_line_max_height: 50     # 40 → 50
stop_line_min_area: 400      # 800 → 400
# 新增：识别加强，降低误检率
stop_line_min_fill_ratio: 0.45        # 轮廓面积/外接矩形面积，越接近1越像实心横线
stop_line_bottom_margin_ratio: 0.55   # 横线下边缘需位于底部ROI的靠后比例范围内
###############
# Align (停车后盲转对齐)
###############
align_speed: 0.18
align_angle_threshold: 2.0
align_stop_time: 0.5         # 1.5 → 0.5（缩短等待）
desired_angle_deg: -5.0      # 0.0 → -5.0（垂直基础上左转5°）
align_angular_speed: 0.35    # 新增：对齐阶段盲转角速度(rad/s)，转动时长 = |desired_angle_deg|(rad) / 该值
###############
# Final forward
###############
final_speed: 0.20
final_distance: 0.60
###############
# Debug
###############
show_debug: true