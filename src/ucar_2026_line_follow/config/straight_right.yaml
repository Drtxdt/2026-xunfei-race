# straight_right.yaml
# 与 stable_right_follow.py 配套的参数配置

# 巡线核心
right_offset: 235
base_speed: 0.18
curve_speed: 0.22
search_speed: 0.03
max_angular: 0.72
search_angular: 0.20

# 动态速度分段
straight_threshold: 18
curve_threshold: 55

# 平滑滤波
angular_alpha: 0.86
error_buffer_size: 6

# 丢线恢复
max_lost: 8

# 横线停车流程
forward_duration: 1.8

# 白线提取
white_v_min: 185
white_s_max: 70
gray_threshold: 195
min_contour_area: 120
max_reflect_ratio: 0.55
min_light_size: 8

# 起步
start_duration: 1.4
start_speed: 0.12

# PID
kp: 0.0042
ki: 0.0
kd: 0.0014
max_integral: 300