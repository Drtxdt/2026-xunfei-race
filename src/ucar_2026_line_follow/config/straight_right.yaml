# straight_right.yaml

# =========================
# topic
# =========================

image_topic: "/usb_cam/image_raw"

cmd_vel_topic: "/cmd_vel"

status_topic: "/line_follow/status"

start_topic: "/line_follow/start"

# =========================
# ROI
# =========================

# 更关注近处
roi_y_start_ratio: 0.42

roi_y_end_ratio: 1.0

# =========================
# 白线检测
# =========================

# 降低反光误判

white_v_min: 185

white_v_max: 255

# 限制饱和度
white_s_max: 70

# 灰度白线
gray_white_threshold: 195

gray_white_max: 255

# =========================
# 形态学
# =========================

morph_kernel_size: 5

# 小面积噪声过滤
min_contour_area: 120

# =========================
# 线段
# =========================

min_line_width_px: 8

min_segment_gap_px: 12

# =========================
# 巡线核心
# =========================

# 小车整体偏左
# 防止压右线

right_offset_px: 240

# =========================
# 速度
# =========================

# 直线速度
base_linear_speed: 0.16

# 弯道速度
curve_linear_speed: 0.18

# 丢线恢复速度
search_linear_speed: 0.03

# =========================
# 转向
# =========================

# 最大角速度
max_angular_speed: 0.72

# 丢线右转速度
search_angular_speed: 0.20

# =========================
# 直线稳定
# =========================

# 小误差认为直线
straight_threshold: 18

# 中等弯道
curve_threshold: 60

# =========================
# 平滑
# =========================

# 越大越稳
# 越小越灵敏

angular_smooth_alpha: 0.86

# =========================
# 丢线
# =========================

max_lost_count: 6

# =========================
# PID
# =========================

kp: 0.0035

ki: 0.0

kd: 0.0011

max_integral: 100

# =========================
# 起步
# =========================

# 起步直行
start_straight_duration: 1.6

# =========================
# 停车
# =========================

# 第一根横线
first_line_y_threshold: 0.75

# 停车后前进速度
after_first_line_speed: 0.04

# 前进25cm时间
# 需要按实际车速微调

after_first_line_duration: 1.8

# =========================
# 超时
# =========================

max_run_time: 60.0