
image_topic: "/usb_cam/image_raw"
# 巡线参数
# ================================

# 越小越靠近右边线
right_offset_px: 150

# 基础速度
base_linear_speed: 0.12

# 最大转向
max_angular_speed: 1.0

# 丢线搜索
search_linear_speed: 0.03
search_angular_speed: 0.40

# ================================
# PID
# ================================

kp: 0.0050
ki: 0.0
kd: 0.0018
max_integral: 100

# ================================
# 起步
# ================================

start_straight_duration: 2.5

# ================================
# 横线停车
# ================================

# 第一根横线位置
first_line_y_threshold: 0.72

# 第二根横线位置
second_line_y_threshold: 0.88

# 第一根线后低速前进
after_first_line_speed: 0.035

# 约30厘米
after_first_line_duration: 7.0

# ================================
# 超时保护
# ================================

max_run_time: 50.0