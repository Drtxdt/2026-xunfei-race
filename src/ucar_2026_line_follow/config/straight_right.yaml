# =========================================================
# Topic
# =========================================================

image_topic: "/usb_cam/image_raw"

cmd_vel_topic: "/cmd_vel"

status_topic: "/line_follow/status"

start_topic: "/line_follow/start"

# =========================================================
# ROI
# =========================================================

roi_y_start_ratio: 0.45

roi_y_end_ratio: 1.0

# =========================================================
# 白线HSV阈值
# =========================================================

white_v_min: 200

white_v_max: 255

white_s_max: 80

# =========================================================
# 灰度白线阈值
# =========================================================

gray_white_threshold: 205

gray_white_max: 255

# =========================================================
# 形态学
# =========================================================

morph_kernel_size: 5

min_contour_area: 80

# =========================================================
# 线段
# =========================================================

min_line_width_px: 6

min_segment_gap_px: 10

# =========================================================
# 巡线参数
# =========================================================

# 更靠中间
# 42cm赛道推荐
right_offset_px: 210

# 正常巡线速度
base_linear_speed: 0.12

# 最大角速度
max_angular_speed: 1.0

# =========================================================
# 丢线恢复
# =========================================================

# 缓慢前进
search_linear_speed: 0.020

# 缓慢右转
search_angular_speed: 0.26

# =========================================================
# PID
# =========================================================

kp: 0.0050

ki: 0.0

kd: 0.0018

max_integral: 100

# =========================================================
# 起步
# =========================================================

start_straight_duration: 2.5

# =========================================================
# 横线停车
# =========================================================

# 第一根横线
first_line_y_threshold: 0.72

# 第二根横线
second_line_y_threshold: 0.88

# 第一根线后低速前进
after_first_line_speed: 0.035

# 25cm
after_first_line_duration: 5.8

# =========================================================
# 超时保护
# =========================================================

max_run_time: 50.0