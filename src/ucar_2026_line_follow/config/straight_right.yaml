# =====================================================
# straight_right.yaml
# 高鲁棒比赛版参数
# =====================================================

# =====================================================
# 摄像头
# =====================================================

image_width: 640

image_height: 480

fps: 30

# =====================================================
# ROI
# =====================================================

# 只看下半部分

roi_y_start_ratio: 0.42

roi_y_end_ratio: 1.00

# =====================================================
# 白线识别
# =====================================================

# HSV动态阈值基础值

white_v_min: 185

# 白色饱和度最大值
# 越小越抗反光

white_s_max: 70

# 灰度白线阈值

gray_threshold: 195

# =====================================================
# 反光过滤
# =====================================================

# 最小轮廓面积

min_contour_area: 120

# 最大反光面积比例

max_reflect_ratio: 0.55

# 最小亮点尺寸

min_light_width: 8

min_light_height: 8

# =====================================================
# 形态学
# =====================================================

morph_kernel_size: 5

# =====================================================
# 巡线
# =====================================================

# 小车整体偏左
# 防止压右线

right_offset: 235

# =====================================================
# PID
# =====================================================

kp: 0.0042

ki: 0.0000

kd: 0.0014

# =====================================================
# 速度
# =====================================================

# 直线速度

base_speed: 0.18

# 弯道速度

curve_speed: 0.22

# 丢线速度

search_speed: 0.03

# =====================================================
# 转向
# =====================================================

# 最大转向角速度

max_angular: 0.72

# 丢线搜索转向

search_angular: 0.20

# =====================================================
# 平滑
# =====================================================

# 越大越稳
# 越小越灵敏

angular_alpha: 0.86

# =====================================================
# 丢线
# =====================================================

max_lost: 8

# =====================================================
# 误差缓冲
# =====================================================

error_buffer_size: 6

# =====================================================
# 横线停车
# =====================================================

# 横线检测区域

horizontal_roi_ratio: 0.82

# 横线宽度比例

horizontal_width_ratio: 0.55

# 连续检测次数

horizontal_detect_count: 4

# =====================================================
# 起步
# =====================================================

start_duration: 1.4

start_speed: 0.12

# =====================================================
# 前进25cm
# =====================================================

forward_speed: 0.04

forward_duration: 1.8

# =====================================================
# 动态速度控制
# =====================================================

# 小误差认为直线

straight_threshold: 18

# 中等误差

curve_threshold: 55

# =====================================================
# CLAHE
# =====================================================

clahe_clip_limit: 2.0

clahe_grid_size: 8

# =====================================================
# 高斯滤波
# =====================================================

gaussian_kernel_size: 5

# =====================================================
# 连续扫描
# =====================================================

scan_rows:
  - 0.96
  - 0.92
  - 0.88
  - 0.84
  - 0.80
  - 0.76

scan_weights:
  - 6
  - 5
  - 4
  - 3
  - 2
  - 1

# =====================================================
# 安全限制
# =====================================================

# 最大运行时间

max_runtime: 60

# 最大积分限制

max_integral: 300

# =====================================================
# 调试
# =====================================================

debug: false

show_mask: false

show_roi: false