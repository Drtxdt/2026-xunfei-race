# ================================
# ROS Topics
# ================================
image_topic: /usb_cam/image_raw
detections_topic: /traffic_light/detections
debug_image_topic: /traffic_light/debug_image
status_topic: /traffic_light/status

# ================================
# Model Configuration
# ================================
model_path: ""                    # empty = auto-resolve $(find yolo)/models/best.pt
confidence_threshold: 0.5
nms_iou_threshold: 0.45
input_size: 640
cpu_reduce_input: true
device: ""                        # auto-detect

# ================================
# Inference Performance
# ================================
inference_rate: 10.0              # Hz

# ================================
# Consensus Filtering (anti-flicker)
# ================================
consensus_confirm_frames: 5       # consecutive detections to lock a class
consensus_release_frames: 3       # consecutive misses to release
consensus_timeout: 1.0            # max seconds to hold without new detection
consensus_ema_alpha: 0.3          # confidence smoothing

# ================================
# Error Recovery
# ================================
max_consecutive_errors: 3
reload_cooldown: 5.0              # seconds between reload attempts
image_timeout: 5.0                # seconds without image before declaring no_image

# ================================
# Debug
# ================================
publish_debug: true
debug_jpeg_quality: 60
flip: false
