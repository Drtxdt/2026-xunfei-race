# ============================================================
# 厂区标识牌 YOLOv5 RKNN 推理节点配置
# ============================================================

# ROS 话题
image_topic: /usb_cam/image_raw
detections_topic: /factory_sign_rknn_test/detections
debug_image_topic: /factory_sign_rknn_test/debug_image
status_topic: /factory_sign_rknn_test/status

# 模型 (3类: food/electronic/daily)
model_path: $(find yolo)/models/factory_sign_3cls_fp16.rknn
input_size: 640
# 模型实际输出 4 类时，用这个映射到 food/electronic/daily。
# 如果日用品标牌不识别，先试: [0, 1, 3]
model_class_indices: [0, 1, 2]
confidence_threshold: 0.3
nms_iou_threshold: 0.45
inference_rate: 10.0
flip: false

# 共识滤波
consensus_confirm_frames: 3
consensus_release_frames: 3
consensus_timeout: 1.0
consensus_ema_alpha: 0.3

# 调试
publish_debug: true
image_timeout: 5.0
save_debug_images: true        # 保存调试截图到 scripts/ 目录

# 语音
enable_speech: true
announce_service: /competition_speech/announce
announce_service_timeout_sec: 0.5
speak_topic: /speak
use_announce_service: true
announce_event: custom
fallback_to_speak_topic: true
slow_speech: true
repeat_same: true
min_speech_interval_sec: 2.0
speech_wait: false
