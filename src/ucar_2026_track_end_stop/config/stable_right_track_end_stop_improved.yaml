# 巡线改良版建议参数（可在 launch 中 rosparam load）
auto_start: true
startup_time: 2.0
startup_speed: 0.35

target_right_x: 205
base_speed: 0.23
curve_speed: 0.14
search_speed: 0.07
search_angular_speed: -0.30
lost_linear_speed: 0.06
lost_angular_speed: -0.18

kp: 0.0040
kd: 0.0010
error_alpha: 0.14
curve_error_threshold: 34.0
curve_angular_gain: 1.10
max_angular_speed: 0.42
steering_deadband_px: 7.0
max_straight_angular_speed: 0.16
max_right_angular_speed: 0.32
straight_angular_alpha: 0.84
curve_angular_alpha: 0.58
straight_angular_step: 0.025
curve_angular_step: 0.065
right_guard_error_px: 60.0
right_guard_speed: 0.10
deadband_angular_decay: 0.40

# 防压右线保护：right_x 越小表示右线越靠近车体中心
right_danger_x: 150
right_emergency_x: 120
right_escape_speed: 0.06
right_escape_angular: 0.36

# 右线连续识别和异常点过滤
line_jump_limit_px: 75
line_search_window_px: 165
min_valid_rows: 3
found_confirm_frames: 2
lost_brake_frames: 3
lost_stop_frames: 10

roi_y_start_ratio: 0.60
white_s_max: 50
white_v_min: 190
morph_kernel_size: 5
min_component_area: 220.0

# ===================== 灰色障碍物（挡板）检测与避障（中间巡线版）=====================
# 触发条件：画面中央 ROI 内最大的灰色轮廓，必须【同时】满足
# 面积 / 宽度 / 高度 / 底边位置 四个阈值，并且连续 obstacle_confirm_frames 帧
# 都满足，才开始侧移避障。动作序列：向【右】移出 → 前进越过 → 向【左】移回。
# 调参口诀：bottom 是距离闸（最常用），area/width/height 是形状闸（防误检）。
# 注意：不写这些参数时代码默认值很苛刻（area>=0.50、连续5帧），基本触发不了。
obstacle_enable_delay: 3.0        # 起步后 N 秒内不检测（防起步时把赛道误判成障碍）
obstacle_gray_s_max: 70           # 灰色 HSV 范围：饱和度 S<=70，亮度 45<=V<=215
obstacle_gray_v_min: 45           #   挡板检测不到时先调这三个（受光线影响大）
obstacle_gray_v_max: 215
obstacle_min_area_ratio: 0.06     # 面积阈值：轮廓面积 / 整幅画面。调大可防小杂物误触发
obstacle_min_width_ratio: 0.30    # 宽度阈值：轮廓宽度 / 画面宽度
obstacle_min_height_ratio: 0.18   # 高度阈值：轮廓高度 / 画面高度
obstacle_min_bottom_ratio: 0.74   # 【触发距离主闸】挡板底边 / 画面高度。越大 = 挡板越贴近车才触发
                                  #   触发早了就 +0.01~0.02；快撞上还不触发就 -0.01~0.02
                                  #   左巡线调参记录：0.62 太早 → 0.72 仍早约 5cm → 0.74
obstacle_confirm_frames: 3        # 连续 N 帧满足才触发，防单帧误检；调小更灵敏，调大更稳
obstacle_lateral_distance_m: 0.50 # 侧移距离（米）：先向右移这么远绕开挡板
obstacle_forward_distance_m: 0.75 # 侧移后向前走的距离（米），要足够越过挡板
                                  #   注意：实际走的比指令值短（加速度爬坡），已按比例补偿过
obstacle_return_lateral_distance_m: 0.45 # 回程侧移距离（米）：越过挡板后向左回移这么远回到原线
                                         #   出/回可以不相等，回多了就调小，回少了就调大
obstacle_lateral_speed: 0.30      # 侧移速度（m/s），太快会滑、姿态飘
obstacle_forward_speed: 0.32      # 避障前进速度（m/s）
obstacle_debug: true              # 打印候选挡板的 area/width/height/bottom 实测值和阈值，调参时必开

end_enable_delay: 3.0
end_roi_y_start_ratio: 0.87
end_min_width_ratio: 0.45
end_stop_hold: 1.0
end_forward_distance_m: 0.65
end_forward_speed: 0.17
end_turn_left_angle_deg: 10.0
end_turn_left_angular_speed: 0.50
