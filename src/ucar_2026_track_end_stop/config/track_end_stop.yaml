# Topics
image_topic: /usb_cam/image_raw
cmd_vel_topic: /cmd_vel
status_topic: /track_end_stop/status
debug_image_topic: /track_end_stop/debug_image
debug_info_topic: /track_end_stop/debug_info

# Startup sequence
auto_start: true
startup_forward_duration: 2.2
startup_forward_speed: 0.16
startup_turn_duration: 3.85
startup_turn_angular_speed: 0.34
startup_enter_duration: 1.8
startup_enter_speed: 0.10

# White-line extraction
white_s_max: 85
white_v_min: 155
gray_white_threshold: 175
morph_kernel_size: 5
min_component_area: 80
max_component_area_ratio: 0.70
min_white_mask_ratio: 0.002
max_white_mask_ratio: 0.32
adaptive_threshold_delta: 28

# Leftmost line following
left_scan_rows: [0.95, 0.92, 0.88, 0.84, 0.80, 0.75, 0.70, 0.64, 0.58]
left_offset_px: 180
left_scan_bottom_weight: 1.8
min_line_width_px: 5
max_line_segment_width_px: 90
min_segment_gap_px: 10
max_target_jump_px: 160

# PID control
kp: 0.0042
kd: 0.0014

# Motion control
base_speed: 0.18
min_speed: 0.075
fast_base_speed: 0.22
fast_error_px: 45.0
medium_error_px: 130.0
hard_error_px: 210.0
medium_speed: 0.12
max_angular_speed: 0.55
angular_alpha: 0.65
lost_timeout: 0.35
lost_speed: 0.00
lost_angular_speed: 0.00
stop_on_lost: true

# End-of-track detection.
# The end of the track is a white boundary wall/line that spans most of the
# image width AND has a nearly horizontal top edge (perpendicular to track sides).
# This distinguishes it from turns where white lines are diagonal.
# Detection scans from bottom-up in the end_roi region, then checks that the
# top edge of the white mass has low y-variance (std <= end_max_top_std).
end_enable_delay: 3.0
end_roi_y_start_ratio: 0.55
end_row_coverage_ratio: 0.70
end_min_covered_rows: 4
end_confirm_frames: 5
end_release_frames: 3
end_max_gap_rows: 2
end_stop_hold: 1.0
end_forward_distance_m: 0.50
end_forward_speed: 0.08
end_max_top_std: 40.0

# Debug relay (compressed JPEG for MobaXterm)
compressed_debug_topic: /track_end_stop/debug_image/compressed
compressed_raw_topic: /track_end_stop/raw_image/compressed
debug_relay_status_topic: /track_end_stop/debug_relay/status
jpeg_quality: 75
debug_resize_width: 0
debug_max_publish_fps: 12.0
publish_raw_compressed: true
