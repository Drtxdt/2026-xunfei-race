# Topics
image_topic: /usb_cam/image_raw
cmd_vel_topic: /cmd_vel
status_topic: /right_track_end_stop/status
debug_image_topic: /right_track_end_stop/debug_image
debug_info_topic: /right_track_end_stop/debug_info

# Startup sequence
auto_start: true
startup_forward_duration: 2.22
startup_forward_speed: 0.16
startup_turn_duration: 3.75
startup_turn_angular_speed: -0.34
startup_enter_duration: 1.8
startup_enter_speed: 0.10

# White-line extraction
white_s_max: 85
white_v_min: 155
gray_white_threshold: 175
morph_kernel_size: 5
min_component_area: 80
max_component_area_ratio: 0.70
min_white_mask_ratio: 0.002
max_white_mask_ratio: 0.32
adaptive_threshold_delta: 28

# Rightmost line following
right_scan_rows: [0.95, 0.92, 0.88, 0.84, 0.80, 0.75, 0.70]
right_offset_px: 200
right_scan_bottom_weight: 1.8
min_line_width_px: 5
max_line_segment_width_px: 90
min_segment_gap_px: 10
max_target_jump_px: 160

# PID control
kp: 0.0042
kd: 0.0014
error_alpha: 0.65

# Motion control
base_speed: 0.22
min_speed: 0.10
fast_base_speed: 0.25
fast_error_px: 60.0
medium_error_px: 130.0
hard_error_px: 210.0
medium_speed: 0.17
max_angular_speed: 0.65
angular_alpha: 0.55
lost_timeout: 0.80
lost_speed: 0.06
lost_angular_speed: 0.00
stop_on_lost: true

# ===================== 灰色障碍物（挡板）检测与避障（右巡线版）=====================
# 触发条件：画面中央 ROI 内最大的灰色轮廓，必须【同时】满足
# 面积 / 宽度 / 高度 / 底边位置 四个阈值，并且连续 obstacle_confirm_frames 帧
# 都满足，才开始侧移避障。右巡线版动作序列：向【左】移出 → 前进越过 → 向【右】移回。
# 调参口诀：bottom 是距离闸（最常用），area/width/height 是形状闸（防误检）。
obstacle_enable_delay: 3.0        # 起步后 N 秒内不检测（防起步时把赛道误判成障碍）
obstacle_gray_s_max: 70           # 灰色 HSV 范围：饱和度 S<=70，亮度 45<=V<=215
obstacle_gray_v_min: 45           #   挡板检测不到时先调这三个（受光线影响大）
obstacle_gray_v_max: 215
obstacle_min_area_ratio: 0.06     # 面积阈值：轮廓面积 / 整幅画面。调大可防小杂物误触发
obstacle_min_width_ratio: 0.30    # 宽度阈值：轮廓宽度 / 画面宽度
obstacle_min_height_ratio: 0.18   # 高度阈值：轮廓高度 / 画面高度
obstacle_min_bottom_ratio: 0.78   # 【触发距离主闸】挡板底边 / 画面高度。越大 = 挡板越贴近车才触发
                                  #   触发早了就 +0.01~0.02；快撞上还不触发就 -0.01~0.02
                                  #   左巡线调参记录：0.62 太早 → 0.72 仍早约 5cm → 0.74
obstacle_confirm_frames: 3        # 连续 N 帧满足才触发，防单帧误检；调小更灵敏，调大更稳
obstacle_lateral_distance_m: 0.52 # 侧移距离（米）：先向左移这么远绕开挡板
obstacle_forward_distance_m: 0.60 # 侧移后向前走的距离（米），要足够越过挡板
                                  #   注意：实际走的比指令值短（加速度爬坡），已按比例补偿过
obstacle_return_lateral_distance_m: 0.44 # 回程侧移距离（米）：越过挡板后向右回移这么远回到原线
                                         #   出/回可以不相等，回多了就调小，回少了就调大
obstacle_lateral_speed: 0.30      # 侧移速度（m/s），太快会滑、姿态飘
obstacle_forward_speed: 0.32      # 避障前进速度（m/s）
obstacle_debug: true              # 打印候选挡板的 area/width/height/bottom 实测值和阈值，调参时必开

# End-of-track detection (segment-based — same strategy as Python reference).
# Scans the bottom portion of the mask for a single continuous white segment
# whose width covers most of the image width. Unlike pixel-counting, this
# naturally distinguishes a real stop line from scattered turn noise.
# Detection works on the SAME post-morphology mask as line-following.
end_enable_delay: 3.0
end_roi_y_start_ratio: 0.87       # start scanning from 87% height (match Python effective region)
end_min_width_ratio: 0.45         # segment width / image width threshold
end_stop_hold: 1.0
end_forward_distance_m: 0.65        # drive forward 65cm after alignment
end_forward_speed: 0.17             # fast forward speed (m/s)
end_turn_left_angle_deg: 10.0       # turn left ~10° to be perpendicular to stop line
end_turn_left_angular_speed: 0.50   # angular speed for the left turn (rad/s)

# Debug relay (compressed JPEG for MobaXterm)
compressed_debug_topic: /right_track_end_stop/debug_image/compressed
compressed_raw_topic: /right_track_end_stop/raw_image/compressed
debug_relay_status_topic: /right_track_end_stop/debug_relay/status
jpeg_quality: 75
debug_resize_width: 0
debug_max_publish_fps: 12.0
publish_raw_compressed: true
