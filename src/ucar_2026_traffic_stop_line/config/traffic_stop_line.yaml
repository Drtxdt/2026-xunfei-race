image_topic: /usb_cam/image_raw
odom_topic: /odom
scan_topic: /scan
cmd_vel_topic: /cmd_vel
status_topic: /traffic_stop_line/status
result_topic: /traffic_stop_line/result
debug_image_topic: /traffic_stop_line/debug_image
start_service: /traffic_stop_line/start

calibrate_only: false
calibration_samples: 30
calibration_file: ~/.ros/traffic_stop_line_calibration.yaml
target_front_gap_m: 0.06

roi_y_start_ratio: 0.45
roi_y_end_ratio: 0.98
white_s_max: 85
white_v_min: 155
gray_white_threshold: 175
morph_kernel_size: 5
min_area: 400.0
max_area_ratio: 0.15
min_fill_ratio: 0.35
min_aspect_ratio: 4.0
min_width_ratio: 0.35
max_height_ratio: 0.18
max_detection_angle_deg: 20.0
window_size: 5
required_hits: 3

search_speed: 0.05
search_timeout_sec: 15.0
max_search_distance: 0.60
approach_speed_far: 0.06
approach_speed_mid: 0.035
approach_speed_near: 0.02
approach_far_error_ratio: 0.12
approach_mid_error_ratio: 0.04
target_y_tolerance_ratio: 0.012
overshoot_margin_ratio: 0.02
angle_tolerance_deg: 3.0
align_stable_sec: 0.4
verify_stable_sec: 0.5
angular_kp: 0.035
angular_min_speed: 0.15
angular_max_speed: 0.18
steering_sign: 1.0

sensor_timeout_sec: 0.5
line_lost_timeout_sec: 0.3
front_obstacle_distance: 0.20
scan_front_half_angle_deg: 15.0
stopped_linear_tolerance: 0.01
stopped_angular_tolerance: 0.03
publish_debug: true
