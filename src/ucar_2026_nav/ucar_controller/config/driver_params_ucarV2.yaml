port: /dev/ttyS0 #ttyUSB0 # base_serial_port
baud: 921600 # 115200 
base_frame: base_link
odom_frame: odom
joy_topic:  /joy          # 游戏手柄输入话题，用于接收遥控指令
odom_topic: /odom         # 里程计输出话题，发布底盘的位姿和速度信息
base_shape_a: 0.2169      # 底盘形状参数，边长还是宽度
wheel_radius: 0.04657     # 车轮半径，用于里程计计算
vel_topic: /cmd_vel
# provide_odom_tf: true
cmd_timeout: 0.2          # 命令超时时间（单位：秒），超过此时间无新指令则停止运动
serial_timeout: 50        # 串口通信超时时间（单位：毫秒）
linear_speed_max:  3.0    # 最大线速度（单位：米/秒）
angular_speed_max: 3.14   # 最大角速度（单位：弧度/秒），约等于180度/秒
Mileage_file_name:  car_Mileage_info.txt # 里程信息存储文件名，用于持久化存储行驶里程数据
debug_log:  false         # 是否启用调试日志，设置为false表示关闭
