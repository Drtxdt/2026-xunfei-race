#Description:
#  全局代价地图参数配置文件,各参数的意义如下：
#  global_frame:在全局代价地图中的全局坐标系;
#  robot_base_frame:机器人的基坐标系;
#0.2quanju  inflation_layer
global_costmap:
  global_frame: map
  robot_base_frame: base_link
  update_frequency: 1.0 #0.5    # 1s更新一次
  publish_frequency: 1.0 #0.5   # 代价发布频率
  static_map: true              # 是否使用静态地图作为基础地图
  rolling_window: false         # 关闭滚动窗口模式（全局地图通常不需要）
  transform_tolerance: 0.5 #10  # 坐标变换的时间容差（秒），允许变换延迟
  track_unknown_space: false    # 对于global来说，只需要膨胀static即可，不需要追踪未知区域
  always_send_full_costmap: false # 只发送更新部分代价地图
  plugins:
    - {name: static_layer,    type: "costmap_2d::StaticLayer"}
    #- {name: obstacle_layer,  type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
    

  static_layer:                       # 静态地图层
    map_topic: "/map"
    subscribe_to_updates: true

  inflation_layer:                    # 膨胀层参数
    inflation_radius: 0.50
    cost_scaling_factor: 10.0

  # obstacle_layer:
  #   enabled: true
  #   obstacle_range: 10.0      # 全局可以设置更大范围
  #   raytrace_range: 10.0
  #   track_unknown_space: false  # 全局不需要追踪未知区域
  #   observation_sources: laser_scan_sensor
