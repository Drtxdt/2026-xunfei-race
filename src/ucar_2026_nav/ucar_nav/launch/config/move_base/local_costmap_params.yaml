local_costmap:
  global_frame: odom #*map
  robot_base_frame: base_link
  static_map: false
  rolling_window: true
  width: 3.0
  height: 3.0
  resolution: 0.03 #0.05
  update_frequency: 10.0
  publish_frequency: 5.0
  transform_tolerance: 0.5 #1.0
  track_unknown_space: false           
  always_send_full_costmap: true
  plugins:
#    - {name: static_layer,    type: "costmap_2d::StaticLayer"}
    - {name: obstacle_layer,  type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
  
  obstacle_layer:
    enabled: true
    obstacle_range: 7.0       # 5米内的障碍物会被放入代价地图中
    raytrace_range: 7.0       # 射线追踪范围：机器人会用射线追踪算法清除5米范围内的障碍物（当障碍物移开后）
    track_unknown_space: true # 是否追踪未知区域（未探测过的区域）
    combination_method: 1     # 多个传感器数据的融合方法（1=取最大值）
    observation_sources: laser_scan_sensor
    laser_scan_sensor: {
      data_type: LaserScan,
      topic: /scan, 
      marking: true, 
      clearing: true
      }    
  
  inflation_layer:                    
    # 真实车体由footprint负责致命碰撞；额外膨胀给锥桶底座和制动留余量。
    inflation_radius: 0.30
    cost_scaling_factor: 6.0
