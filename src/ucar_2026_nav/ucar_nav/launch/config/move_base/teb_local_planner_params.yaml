TebLocalPlannerROS:
 odom_topic: odom
 map_frame: /map
 # Trajectory
  
 teb_autosize: True          # 是否自动调整 elastic band 的节点数量：在急弯处自动加密节点（更精确），在直道上自动稀疏节点（减少计算量）
 dt_ref: 0.30 #0.3           # 相邻节点之间的参考时间间隔：理想情况下，每两个路径点之间应该花多少时间：dt_ref 越小，轨迹节点越密集，优化精度越高，但计算量越大
 dt_hysteresis: 0.1          # 相邻节点之间的参考时间滞后阈值

 # elastic band 的节点数量限制
 min_samples: 3              # 即使路径很短，也至少保留 3 个节点（起点、中间、终点）
 max_samples: 500            # 防止节点爆炸导致优化器无法收敛，500 是一个很宽松的上限
 global_plan_overwrite_orientation: True #True 时，TEB 会基于全局路径的几何形状重新计算每个点的朝向（前视方向）
 allow_init_with_backwards_motion: False # 允许起始点可以倒车
 force_reinit_new_goal_dist: 1.0         # 新目标与旧目标的距离超过此阈值时，强制完全重新初始化
 max_global_plan_lookahead_dist: 2.0     #3.0 只截取全局路径中"当前位置前方"的一段来优化。值越小，计算越快，但容易陷入局部最优。值越大，TEB 看得越远，可以提前规避远处的障碍物，但优化变量更多、计算更慢
 global_plan_viapoint_sep: -1 #当前没启用  # 是否从全局路径中抽取全局规划途经点来约束TEB，>0 时，TEB 会在全局路径上按此间距采样 via points，并在优化中加入"轨迹应尽量经过这些点"的约束
 global_plan_prune_distance: 0.6 #1.0    # 从全局路径中删除已经走过的点。0.6m 意味着已经过的、距离当前位姿小于 0.6m 的全局路径点会被剪掉。防止TEB为了"回头贴全局路径"而产生不必要的绕圈
 exact_arc_length: False                 # False：用欧几里得距离近似  True：用圆弧积分计算真实弧长（考虑朝向变化
 feasibility_check_no_poses: 4 #！3 #5   # 优化完成后，检查轨迹上多少个位姿的可行性。值越大检查越严格，但可能因微小碰撞 footprint 而误报失败
 publish_feedback: False #调试信息发布 设为 True 可在 RViz 中可视化 TEB 的内部轨迹（话题如 /teb_feedback），用于调参观察
    
 # Robot运动学约束
         
 max_vel_x: 0.8 #！1.2 #0.4
 max_vel_x_backwards: 0.7 #！0.5 #0.2
 max_vel_y: 0.8 #0.1
 max_vel_theta: 2.0 #@1.5 #！1 #0.3
 acc_lim_x: 0.5
 acc_lim_y: 0.5 #0.2
 acc_lim_theta: 1.3 #@1.0 #！0.3 #0.5
 min_turning_radius: 0.1 #!0.0 # omni-drive robot (can turn on place!)

 footprint_model: # teb碰撞检测模型：线型。还有点和多边形
  type: "line" #point
  line_start: [0.13, 0.0]  # 一条长 0.26m 的线段，中点在 (0, 0)
  line_end: [-0.13, 0.0]
  # 独立用于障碍物距离计算的，和代价地图的运动学模型用于膨胀半径计算的模型不一样。两者应保持一致

 # GoalTolerance 目标容忍度
    
 xy_goal_tolerance: 0.15 #@0.1 #0.2
 yaw_goal_tolerance: 0.1 #@0.05 #0.1
 free_goal_vel: False    # 到达终点时是否允许有残余速度，不允许是因为终点有任务
 complete_global_plan: True # True：即使局部优化看到前方有捷径可以直达终点，也必须沿着全局路径的 shape 走。False：TEB 可以抄近路直达终点
    
 # Obstacles 障碍物处理
    
 min_obstacle_dist: 0.15 #0.25   # 机器人与任何障碍物的期望最小距离。安全泡距离，teb尽量优化距离障碍物的距离
 inflation_dist: 0.18 #0.6       # 它会对距离[min_obstacle_dist, inflation_dist]内的障碍物施加衰减惩罚
 include_costmap_obstacles: True # True 时，TEB 会把 costmap 中的 occupied cells 转换为点/多边形障碍
 costmap_obstacles_behind_robot_dist: 1.0 # 机器人后方多远的障碍物会被考虑
 obstacle_poses_affected: 15     # 每个障碍物最多影响轨迹上的多少个位姿节点。值越大优化越精确但越慢；值越小越快但可能出现"某些位姿突然靠近障碍"的情况
 costmap_converter_plugin: "" # 代价地图转换插件，costmap 是栅格形式，TEB 需要把栅格障碍转换为几何图元（点/线/多边形)才能进行距离计算
 # 可以加载 costmap_converter::CostmapToPolygonsDBSMCCH 等插件，occupied cells 聚类为凸多边形，大幅减少障碍物数量
 
 
 costmap_converter_spin_thread: True # 是否在独立线程中运行代价地图转换
 costmap_converter_rate: 5           # 转换频率

 # Optimization 优化器参数
    
 no_inner_iterations: 5 #减小可以增加性能 # 内迭代太少：轨迹没有收敛到局部最优就开始下一轮外迭代
 no_outer_iterations: 4 #减小可以增加性能 # 障碍物关联没有更新，可能优化出的轨迹撞上了"旧关联"没覆盖的新障
 optimization_activate: True # 是否启用优化
 optimization_verbose: False # 是否打印优化器的详细信息
 penalty_epsilon: 0.1 # 约束惩罚的松弛量，0.1是一个合理的值
 obstacle_cost_exponent: 2 #4  # 障碍物惩罚的指数= 1：线性惩罚，距离障碍越近惩罚线性增加2：二次惩罚，贴近障碍时"急剧变贵"，让优化器更保守4（你注释掉的值）：极度保守，稍微靠近障碍就付出巨大代价
 
 ### 当某个约束被违反时，我愿意付出多少代价来纠正它
        # 如果机器人实际运动中频繁超速（可以在 /cmd_vel 中观测），应提高对应权重（如 weight_max_vel_x 提到 5~10）
        # 如果机器人加速太猛导致打滑，提高 weight_acc_lim_x

 weight_max_vel_x: 2
 weight_max_vel_y: 2
 weight_max_vel_theta: 1
 weight_acc_lim_x: 1
 weight_acc_lim_y: 1
 weight_acc_lim_theta: 1
 ###

 weight_kinematics_nh: 50 # 惩罚侧向滑动 #要全向移动就1，不想侧滑就1000,如果比赛中需要大量侧向微调（如窄道对齐货架），应降到 10~100
 weight_kinematics_forward_drive: 100 #1  # 惩罚后退运动 # 与 allow_init_with_backwards_motion = False 的配合
 weight_kinematics_turning_radius: 1 # 惩罚小于 min_turning_radius 的转弯 如果机器人频繁原地打转，可以提到 10~100
 weight_optimaltime: 1 # must be > 0 # 惩罚总耗时 1为强制轨迹尽快完成
 weight_shortest_path: 0 # 惩罚路径几何长度 # 0 表示完全不关心路径长短，只关心时间最优。这在比赛中通常是对的
 weight_obstacle: 100 # 障碍物距离惩罚的总权重。100 是一个很高的值，说明安全是最高优先级
 weight_inflation: 0.0 # 0.2 在 min_obstacle_dist 和 inflation_dist 之间的区域，除了基础障碍惩罚外，再叠加一层 0.2 权重的衰减惩罚，现在膨胀层完全不惩罚
 weight_dynamic_obstacle: 10 # 如果 TEB 接收到动态障碍物信息（如通过 /teb_obstacles 话题），这些碍使用独立的权重 10（比静态障碍 100 低，但仍然显著）
 weight_dynamic_obstacle_inflation: 0.2 # 动态障碍物的膨胀权重
 weight_viapoint: 1 # 途经点跟踪权重。当前未启用（global_plan_viapoint_sep = -1），所以此参数无效
 weight_adapt_factor: 2

 # Homotopy Class Planner 同伦类规划是 TEB 的高级特性，用于探索不同拓扑结构的路径（如"从障碍左侧绕" vs "从障碍右侧绕"）。
 # 未启用
 enable_homotopy_class_planning: False 
 enable_multithreading: True
 max_number_classes: 1
 selection_cost_hysteresis: 1.0
 selection_prefer_initial_plan: 0.9
 selection_obst_cost_scale: 1.0
 selection_alternative_time_cost: False
 
 roadmap_graph_no_samples: 15
 roadmap_graph_area_width: 5
 roadmap_graph_area_length_scale: 1.0
 h_signature_prescaler: 0.5
 h_signature_threshold: 0.1
 obstacle_heading_threshold: 0.45
 switching_blocking_period: 0.0
 viapoints_all_candidates: True
 delete_detours_backwards: True
 max_ratio_detours_duration_best_duration: 3.0
 visualize_hc_graph: False
 visualize_with_time_as_z_axis_scale: False

# Recovery
 
 shrink_horizon_backup: True
 shrink_horizon_min_duration: 10
 oscillation_recovery: True
 oscillation_v_eps: 0.1
 oscillation_omega_eps: 0.1
 oscillation_recovery_min_duration: 10
 oscillation_filter_duration: 10

