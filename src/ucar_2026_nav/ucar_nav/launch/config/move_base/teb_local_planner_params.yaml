# 推荐方案 1：mppi_local_planner（ROS1 移植版）
#   ─────────────────────────────────────────────

#   • 仓库：Forrest-Z/mppi_local_planner
#   • 特点：
#     • 这是 Nav2 MPPI Controller 的 ROS1 移植，基于 Eigen，不依赖 xtensor
#     • 实现了 nav_core::BaseLocalPlanner 接口，可以直接替换 TEB，接入你的 move_base
#     • 支持 Differential / Omnidirectional / Ackermann 三种运动模型
#     • 支持 动态重配置（dynamic_reconfigure）
#     • 使用 Plugin-Based Critic Functions（路径跟踪、障碍物避让、速度约束、平滑性等都是可插拔
#       分项）
#     • 采样 + Softmax 权重平均的 MPC 框架，天然适合全向轮底盘的高速避障
#   接入你的项目只需：
#   <!-- move_base 中修改局部规划器 -->
#   <param name="base_local_planner" value="mppi_local_planner/MPPIControllerROS"/>


# 问题 1：机器人在走廊/窄道中左右振荡
#   ───────────────────────────────────

#   表现：沿墙走时车头不断左右摇摆，速度上不去，甚至在窄道卡死。

#   根本原因：
#   • max_global_plan_lookahead_dist = 1.5 太短，配合 max_vel_x = 2.5，机器人以高速运行时每步
#     规划 1.5m，相当于只看眼前，无法平滑预判走廊走向
#   • weight_optimaltime = 1 与 weight_obstacle = 100 严重失衡，TEB 为了"不碰墙"宁愿剧烈转向
#   • dt_ref = 0.35 导致节点稀疏，优化出的轨迹曲率变化突兀
#   调参策略：
#   max_global_plan_lookahead_dist: 2.5        # 高速必须看更远，至少 = max_vel_x * 1.0
#   dt_ref: 0.25                              # 节点加密，转弯更平滑
#   weight_optimaltime: 2                     # 提高时间权重，减少过度保守的绕行
#   weight_obstacle: 50                       # 适当降低（如果场地静态且定位准）
#   acc_lim_x: 1.0                            # 提高加速度，减少因加速慢导致的"迟疑-急转"


#   问题 2：高速前进时撞墙/刮擦障碍物
#   ─────────────────────────────────

#   表现：直线跑很快，但前方突然出现障碍或转弯时反应不过来，直接撞上。

#   根本原因：
#   • max_global_plan_lookahead_dist = 1.5 对于 2.5m/s 的速度意味着只有 0.6 秒 的反应时间，加
#     底盘执行延迟和雷达数据延迟，根本刹不住
#   • acc_lim_x = 0.5 制动加速度太小，刹车距离 $s = v^2 / (2a) = 2.5^2 / (2*0.5) = 6.25m$，远
#     前瞻距离
#   • min_obstacle_dist = 0.15 太激进，没有给定位误差留余量
#   调参策略：
#   max_global_plan_lookahead_dist: 3.0        # 必须远大于刹车距离需求
#   acc_lim_x: 1.5                             # 提高减速度，缩短刹车距离
#   min_obstacle_dist: 0.25                    # 留出定位误差余量（AMCL 可能有几厘米漂移）
#   inflation_dist: 0.40                       # 必须明显大于 min_obstacle_dist
#   feasibility_check_no_poses: 12             # 增加检查位姿数，防止"漏检"碰撞

#   物理验算：
#   • 原配置刹车距离：2.5^2 / (2*0.5) = 6.25m
#   • 建议配置刹车距离：2.5^2 / (2*1.5) = 2.08m，配合 lookahead = 3.0m 才安全


# 问题 3：规划失败，move_base 进入 Recovery 行为
#   ──────────────────────────────────────────────

#   表现：TebLocalPlannerROS 频繁报告 Failed to find valid trajectory，机器人开始清除代价地图
#   、原地旋转。

#   根本原因：
#   • no_inner_iterations = 5 / no_outer_iterations = 4 不够，复杂环境下轨迹未收敛
#   • obstacle_poses_affected = 15 太少，某些轨迹点没有被障碍物约束覆盖
#   • feasibility_check_no_poses = 8 太严格，优化后微小碰撞 footprint 被判定为不可行
#   • penalty_epsilon = 0.1 太小，约束过于 rigid，优化器难以找到可行解
#   调参策略：
#   no_inner_iterations: 8                     # 提高收敛精度
#   no_outer_iterations: 5                     # 增加障碍关联更新次数
#   obstacle_poses_affected: 25                # 让更多轨迹点关联到障碍物
#   penalty_epsilon: 0.2                       # 放宽约束松弛量
#   shrink_horizon_backup: True                # 已启用，保持。失败时自动缩短前瞻距离
#   shrink_horizon_min_duration: 5             # 更快恢复正常前瞻距离

# 问题 4：到达终点后在目标附近来回打转，无法报告到达
#   ──────────────────────────────────────────────────

#   表现：已经到目标点了，但一直左右调整方向，无法触发 Goal Reached。

#   根本原因：
#   • weight_kinematics_forward_drive = 1000 强烈禁止后退，导致机器人调整姿态时只能"前进-旋转-
#     进"，无法原地或侧移精调
#   • yaw_goal_tolerance = 0.1（约 5.7°）比较严格，而 xy_goal_tolerance = 0.15 相对宽松，造成"
#     位了但角度差一点点"的拉锯
#   • weight_kinematics_nh = 1000 禁止侧移，麦克纳姆轮失去全向调整优势
#   调参策略：
#   weight_kinematics_forward_drive: 1         # 终点附近允许后退微调
#   weight_kinematics_nh: 10                   # 允许侧移辅助对准（至少终点阶段）
#   yaw_goal_tolerance: 0.15                   # 放宽角度容差（或配合更精确的全局规划）
#   free_goal_vel: False                       # 保持 False，确保停车
#   complete_global_plan: False                # 允许抄近路到达终点，减少无谓绕行

#   进阶方案：在 process.py 中，接近终点时（如 < 0.3m）主动 cancel move_base goal，切换到自己
#   的 PID 精调逻辑（你代码里已经有类似 adjust_distance_to_back_1m() 的做法）。

# 问题 5：明明是全向轮，TEB 却只用"前进+旋转"，运动效率低
#   ───────────────────────────────────────────────────────

#   表现：在空旷场地对齐目标时，不直接侧移，而是走弧形绕过去。

#   根本原因：
#   weight_kinematics_nh: 1000                 # 强烈惩罚非完整约束违反 = 禁止侧移
#   weight_kinematics_forward_drive: 1000      # 强烈禁止后退
#   TEB 被配置得像一个差速底盘。

#   调参策略：
#   weight_kinematics_nh: 1                    # 允许全向移动（麦克纳姆轮物理上就是全向的）
#   weight_kinematics_forward_drive: 10        # 轻微偏好前进，但不禁止后退
#   max_vel_y: 0.4                             # 提高侧移速度上限
#   acc_lim_y: 0.3                             # 侧移加速度限制

#   风险提示：侧移时麦克纳姆轮的辊子（roller）容易打滑，导致里程计漂移。如果你的底盘侧移控制不
#   精确（编码器积分误差大），不要完全放开 nh，建议 10~50 而非 1。


# 问题 6：通过门洞/狭窄通道时被卡住或拒绝通过
#   ───────────────────────────────────────────

#   表现：门前明明够宽，TEB 规划失败或反复试探不前进。

#   根本原因：
#   • footprint_model 是 line（线段），但实际机器人宽度（0.256m，从 footprint [[0.171, -0.128]
#     .] 算出）加上 min_obstacle_dist = 0.15 后，等效宽度 = 0.256 + 2*0.15 = 0.556m。如果门洞
#     有 0.7m，余量很小
#   • inflation_dist = 0.18 只比 min_obstacle_dist 大 0.03m，衰减区太短，导致 TEB 对门洞边缘的
#     罚下降过快，优化器认为"稍微蹭一下代价不高"
#   • 代价地图的膨胀层（inflation_radius = 0.1 在 local_costmap）与 TEB 的 min_obstacle_dist
#     加，进一步压缩了可行区域
#   调参策略：
#   # TEB 侧
#   min_obstacle_dist: 0.12                    # 窄道适当降低（前提：定位精度高）
#   inflation_dist: 0.30                       # 保持足够衰减区
#   obstacle_cost_exponent: 4                  # 接近障碍时代价急剧上升（窄道更保守）

#   # Costmap 侧（local_costmap_params.yaml）
#   inflation_radius: 0.05                     # 降低局部代价地图膨胀，把安全距离控制权交给 TE
#   B

#   更优方案：把 footprint_model 从 line 换成 polygon，用精确 footprint：
#   footprint_model:
#     type: "polygon"
#     vertices: [[0.171, 0.128], [0.171, -0.128], [-0.171, -0.128], [-0.171, 0.128]]

# 问题 7：轨迹频繁跳变，机器人运动不平滑
#   ──────────────────────────────────────

#   表现：每帧 /cmd_vel 的方向/速度突变，机器人一顿一顿。

#   根本原因：
#   • force_reinit_new_goal_dist = 1.0 太敏感，全局路径微小更新导致 TEB 频繁重初始化
#   • global_plan_overwrite_orientation = True 与全局规划器方向不兼容，每次重新计算方向导致 TE
#     初始 guess 突变
#   • dt_ref 大导致节点稀疏，优化出的轨迹帧间差异大
#   调参策略：
#   force_reinit_new_goal_dist: 2.0            # 只有目标明显变化时才重初始化
#   dt_ref: 0.2                                # 加密节点
#   global_plan_overwrite_orientation: False    # 如果全局规划器方向已正确，不要覆盖
#   publish_feedback: True                     # 开启调试，RViz 中观察轨迹是否跳变
