    y: -1.7735
    yaw: 1.0417
    rotations:
      - {direction: "left", duration: 4.5}

  - x: -1.6613
    y: -2.2796
    yaw: -3.1404
    rotations:
      - {direction: "right", duration: 3.0}
      - {direction: "left", duration: 3.5}

  - x: -1.6846
    y: -2.7856
    yaw: -3.1176
    rotations:
      - {direction: "left", duration: 4.5}

  - x: -0.6965
    y: -2.8239
    yaw: -1.5594
    rotations:
      - {direction: "right", duration: 3.0}
      - {direction: "left", duration: 3.0}

  - x: 1.2660
    y: -2.8863
    yaw: -1.5443
    rotations:
      - {direction: "right", duration: 3.0}
