# ROS topics
image_topic: /usb_cam/image_raw
detections_topic: /signboard_rknn_test/detections
debug_image_topic: /signboard_rknn_test/debug_image
status_topic: /signboard_rknn_test/status

# Model
model_path: $(find yolo)/models/cls_best.rknn
input_size: 640              # 640 FP16 model
confidence_threshold: 0.5
nms_iou_threshold: 0.45
inference_rate: 10.0
flip: false

# Consensus filtering
consensus_confirm_frames: 3
consensus_release_frames: 3
consensus_timeout: 1.0
consensus_ema_alpha: 0.3

# Debug
publish_debug: true
image_timeout: 5.0

# Speech
enable_speech: true
announce_service: /competition_speech/announce
announce_service_timeout_sec: 0.5
speak_topic: /speak
use_announce_service: true
announce_event: custom          # custom = speak slow text; task2 = standard signboard decision
fallback_to_speak_topic: true
slow_speech: true
repeat_same: false
min_speech_interval_sec: 2.0
speech_wait: false

# Save output to yolo/outputs
save_output: true
save_dir: ""                   # empty = auto-resolve to $(find yolo)/outputs
save_interval_sec: 1.0         # minimum seconds between saved frames
