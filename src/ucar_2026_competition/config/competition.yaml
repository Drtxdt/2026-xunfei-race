# 任务1：先运行团队已有的 simple_navigator/navigate.launch。
# 目标点继续由 simple_navigator/config/navigation_goal.yaml（或 map_goal_picker）管理，
# 比赛总控只旁路监听 move_base 的 goal/result，不修改导航包。
qr_navigation_timeout_sec: 120.0
# 保持扫码起始位姿执行一轮完整扫描；每次转30度后停车0.3秒。
# 网络结果后台并发返回，收齐三码后立即启动大模型和下一阶段预热。
qr_odom_topic: /odom
qr_odom_stale_sec: 0.5
qr_odom_wait_sec: 2.0
qr_scan_angular_speed: 0.60
qr_final_return_angular_speed: 1.20
qr_final_return_min_angular_speed: 0.25
qr_final_return_slowdown_angle_rad: 0.4363323129985824
qr_scan_step_angle_rad: 0.5235987755982988
qr_scan_total_angle_rad: 6.283185307179586
qr_scan_settle_sec: 0.3
qr_scan_stationary_hold_sec: 0.20
qr_scan_stop_timeout_sec: 1.5
qr_decoder_ready_timeout_sec: 6.0
qr_decoder_warmup_sec: 0.4
qr_scan_result_grace_sec: 20.0
qr_scan_pending_idle_sec: 0.5
qr_scan_extra_sweep_angle_rad: 2.0943951023931953
qr_final_yaw_tolerance_rad: 0.03490658503988659
qr_scan_timeout_sec: 60.0
qr_scan_step_timeout_margin_sec: 2.0
qr_rotation_min_clearance: 0.28
qr_expected_count: 3
# 单轮扫描不足三个码时直接报错并等待恢复，不再移动到备用点重复扫码。
qr_fallback_enabled: true
qr_fallback_navigation_timeout_sec: 45.0
qr_fallback_goal:
  x: -1.4643
  y: -0.1390
  yaw: 1.5834
move_base_timeout_sec: 90.0

# 任务1语音握手：先播完“我在”才开启AIUI，收到有效类别后先关闭AIUI、播“好的”，再导航。
voice_wakeup_reply: "我在"
voice_command_reply: "好的"
voice_retry_reply: "请再说一次"
voice_start_listening_service: /speech_command_node/start_listening
voice_stop_listening_service: /speech_command_node/stop_listening

# OCR时间窗证据。空白帧不清空，其他完整类别会清空当前目标证据。
ocr_required_hits: 2
ocr_evidence_window_sec: 1.5
ocr_ready_timeout_sec: 12.0
# Distant signs remain available to semantic memory, but cannot interrupt
# navigation until the OCR box is large enough for reliable visual centering.
task2_trigger_min_bbox_width_ratio: 0.09
task2_trigger_min_bbox_height_ratio: 0.06
task2_trigger_min_bbox_area_ratio: 0.006
# 图像横向误差为正时的转向符号。首次低速居中测试必须确认方向。
target_center_steering_sign: -1.0
target_center_coarse_step_deg: 4.0
target_center_fine_step_deg: 2.0
target_center_start_speed: 0.28
target_center_max_speed: 0.45
target_center_timeout_sec: 20.0
# 厂牌居中后，车头射线相对相机光轴的实车标定偏差。
camera_boresight_yaw_offset: 0.0
factory_navigation_timeout_sec: 420.0
task2_prewarm_enabled: true
factory_navigation_start_service: "/vision_triggered_navigator/start_navigation"
# 任务2停车框贴墙且厂牌居中，以四轮全部入框为目标。
parking_box_width: 0.50
parking_box_depth: 0.50
parking_goal_offset: 0.26
parking_staging_offset: 0.55
parking_staging_timeout_sec: 20.0
parking_staging_position_tolerance: 0.16
parking_staging_yaw_tolerance: 0.10
parking_docking_timeout_sec: 30.0
parking_obstacle_min_clearance: 0.24
parking_obstacle_clearance_tolerance: 0.005
parking_obstacle_sector_half_angle_deg: 35.0
parking_dock_max_x: 0.10
parking_dock_max_y: 0.06
parking_dock_max_yaw: 0.30
parking_dock_min_yaw: 0.30
parking_dock_normal_tolerance: 0.02
parking_dock_tangent_tolerance: 0.02
parking_dock_yaw_tolerance: 0.05
parking_min_wall_distance: 0.19
parking_lidar_stop_distance: 0.15
parking_recenter_tolerance: 0.08
parking_recenter_timeout_sec: 8.0
parking_recenter_initial_wait_sec: 1.0
parking_wall_fit_half_angle_deg: 35.0
parking_wall_fit_min_points: 12
parking_wall_fit_min_span: 0.25
parking_wall_fit_near_min_span: 0.18
parking_wall_fit_max_distance_jump: 0.05
parking_wall_fit_max_normal_jump_deg: 8.0
parking_wall_fit_max_residual: 0.015
parking_wall_fit_max_normal_error_deg: 20.0
parking_xy_tolerance: 0.04
parking_yaw_tolerance: 0.06
parking_normal_offset: 0.0
parking_tangent_offset: 0.0
target_trigger_service: /vision_triggered_navigator/trigger_target
trigger_ack_timeout_sec: 2.0
task1_task2_handoff_timeout_sec: 5.0
task1_task2_handoff_stable_sec: 0.5
# 每次离开贴墙停车框都先直线倒车，禁止move_base从框内强行规划。
task2_inter_visit_reverse_distance_m: 0.32
task2_inter_visit_reverse_speed_mps: 0.08
task2_inter_visit_rear_clearance_m: 0.28
task2_inter_visit_sensor_stale_sec: 0.5
task2_inter_visit_timeout_sec: 7.0
task4_factory_egress_enabled: true
task4_factory_egress_reverse_distance_m: 0.32
task4_factory_egress_reverse_speed_mps: 0.08
task4_factory_egress_rear_clearance_m: 0.28
task4_factory_egress_sensor_stale_sec: 0.5
task4_factory_egress_timeout_sec: 7.0
# 默认从最终车间直接交给停止线导航；仅在现场确认需要绕行时手动启用内部点。
task4_internal_waypoint_enabled: false
task4_internal_waypoint_x: 1.2660
task4_internal_waypoint_y: -2.8863
task4_internal_waypoint_yaw: -1.5443
task4_internal_waypoint_timeout_sec: 45.0
# 任务2厂牌覆盖扫描：仅传给coverage_search_mode导航节点。
coverage_scan_step_deg: 20.0
coverage_scan_angular_speed: 0.50
coverage_scan_dwell_sec: 0.45
coverage_candidate_hold_sec: 1.2
coverage_scan_max_dwell_sec: 2.0
coverage_non_target_min_scan_steps: 2
coverage_scan_pose_timeout_sec: 0.5
coverage_goal_soft_timeout_sec: 7.0
coverage_goal_hard_timeout_sec: 10.0
coverage_goal_progress_window_sec: 5.0
coverage_goal_min_progress: 0.03
coverage_anchor_observation_radius: 0.35
coverage_near_anchor_stall_timeout_sec: 3.0
coverage_rotation_watchdog_window_sec: 5.0
coverage_rotation_min_progress: 0.03
coverage_rotation_max_yaw_deg: 90.0
coverage_rotation_min_clearance: 0.28
# 交由 move_base/costmap 绕障；设为 0 禁用会误取消整个位点的激光平移门槛。
coverage_translation_min_clearance: 0.00
coverage_translation_sector_half_angle_deg: 35.0
coverage_max_vel_x: 0.72
coverage_max_vel_y: 0.72
coverage_max_vel_theta: 1.45
coverage_cruise_vel_x: 0.70
coverage_cruise_vel_y: 0.70
coverage_cruise_vel_theta: 1.30
coverage_caution_vel_x: 0.53
coverage_caution_vel_y: 0.53
coverage_caution_vel_theta: 1.12
coverage_caution_enter_clearance: 0.45
coverage_caution_exit_clearance: 0.55
coverage_fast_exit_clearance: 0.75
coverage_fast_enter_clearance: 0.90
coverage_speed_update_min_interval_sec: 0.50
coverage_goal_retry_count: 1
coverage_anchor_position_tolerance: 0.15
coverage_anchor_yaw_tolerance_deg: 3.44
coverage_anchor_yaw_hold_sec: 0.5
coverage_anchor_yaw_timeout_sec: 20.0
task2_no_workshop_anchors: []
# 第二轮优先使用第一轮仓库记忆；未记住目标时从下一个未扫描点继续。
task2_resume_coverage_enabled: true
task2_second_search_abort_fail_fast_count: 0
task2_remembered_heading_confirm_sec: 1.2
task2_remembered_heading_scan_half_angle_deg: 18.0
# 连续确认近距离非目标厂牌后结束当前观察点剩余转角；第二轮继续复用仓库记忆。
task2_non_target_early_exit: true
task2_non_target_early_exit_min_score: 0.62
task2_non_target_topic: /vision/non_target_observation

# 仿真独立 ROS Master，通过 TCP 协同。
sim_bridge_port: 26003
sim_timeout_sec: 900.0
# 子任务3播报前先确认静止，播报期间持续发布零速度；任何运动都会阻止进入任务4。
stationary_announcement_stable_sec: 0.5
stationary_announcement_odom_stale_sec: 0.5
stationary_announcement_ready_timeout_sec: 3.0

# 交通灯坐标必须经实车标定后显式设置。未设置时流程安全暂停。
traffic_pose_configured: false
traffic_x: 0.2395
traffic_y: -3.10
traffic_yaw: -1.5596
traffic_timeout_sec: 180.0
task4_final_progress_tolerance_m: 0.008
task4_final_stop_min_m: 0.03
task4_final_stop_max_m: 0.05

track_timeout_sec: 420.0
status_topic: /competition/status
task1_result_topic: /competition/task1_result
