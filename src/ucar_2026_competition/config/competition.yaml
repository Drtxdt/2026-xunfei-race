# 任务1：先运行团队已有的 simple_navigator/navigate.launch。
# 目标点继续由 simple_navigator/config/navigation_goal.yaml（或 map_goal_picker）管理，
# 比赛总控只旁路监听 move_base 的 goal/result，不修改导航包。
qr_navigation_timeout_sec: 120.0
# 停转扫描：20度一档，停车0.6秒取稳定帧；一处最多转一整圈。
qr_odom_topic: /odom
qr_odom_stale_sec: 0.5
qr_odom_wait_sec: 2.0
qr_scan_angular_speed: 0.20
qr_scan_step_angle_rad: 0.3490658503988659
qr_scan_settle_sec: 0.6
qr_scan_timeout_sec: 60.0
qr_scan_step_timeout_margin_sec: 2.0
qr_expected_count: 3
# 第一圈不足三个时，使用现有 move_base 前往二维码区中间标定点。
qr_fallback_enabled: true
qr_fallback_navigation_timeout_sec: 45.0
qr_fallback_goal:
  x: -1.4643
  y: -0.1390
  yaw: 1.5834
move_base_timeout_sec: 90.0

# 任务1语音握手：先播完“我在”才开启AIUI，收到有效类别后先关闭AIUI、播“好的”，再导航。
voice_wakeup_reply: "我在"
voice_command_reply: "好的"
voice_retry_reply: "请再说一次"
voice_start_listening_service: /speech_command_node/start_listening
voice_stop_listening_service: /speech_command_node/stop_listening

# OCR时间窗证据。空白帧不清空，其他完整类别会清空当前目标证据。
ocr_required_hits: 2
ocr_evidence_window_sec: 1.5
ocr_ready_timeout_sec: 12.0
# 图像横向误差为正时的转向符号。首次低速居中测试必须确认方向。
target_center_steering_sign: -1.0
target_center_coarse_step_deg: 4.0
target_center_fine_step_deg: 2.0
target_center_start_speed: 0.20
target_center_max_speed: 0.35
target_center_timeout_sec: 12.0
# 厂牌居中后，车头射线相对相机光轴的实车标定偏差。
camera_boresight_yaw_offset: 0.0
factory_navigation_timeout_sec: 420.0
# 任务2停车框贴墙且厂牌居中，以四轮全部入框为目标。
parking_box_width: 0.50
parking_box_depth: 0.50
parking_goal_offset: 0.26
parking_staging_offset: 0.55
parking_staging_timeout_sec: 20.0
parking_staging_position_tolerance: 0.10
parking_staging_yaw_tolerance: 0.10
parking_docking_timeout_sec: 15.0
parking_dock_max_x: 0.10
parking_dock_max_y: 0.06
parking_dock_max_yaw: 0.15
parking_dock_min_yaw: 0.15
parking_dock_normal_tolerance: 0.015
parking_dock_tangent_tolerance: 0.02
parking_dock_yaw_tolerance: 0.035
parking_min_wall_distance: 0.19
parking_lidar_stop_distance: 0.15
parking_recenter_tolerance: 0.04
parking_recenter_timeout_sec: 8.0
parking_recenter_initial_wait_sec: 1.0
parking_wall_fit_half_angle_deg: 35.0
parking_wall_fit_min_points: 12
parking_wall_fit_min_span: 0.25
parking_wall_fit_near_min_span: 0.18
parking_wall_fit_max_distance_jump: 0.05
parking_wall_fit_max_normal_jump_deg: 8.0
parking_wall_fit_max_residual: 0.015
parking_wall_fit_max_normal_error_deg: 20.0
parking_xy_tolerance: 0.04
parking_yaw_tolerance: 0.06
parking_normal_offset: 0.0
parking_tangent_offset: 0.0
target_trigger_service: /vision_triggered_navigator/trigger_target
trigger_ack_timeout_sec: 2.0
task1_task2_handoff_timeout_sec: 5.0
task1_task2_handoff_stable_sec: 0.5
# 任务2厂牌覆盖扫描：仅传给coverage_search_mode导航节点。
coverage_scan_step_deg: 20.0
coverage_scan_angular_speed: 0.35
coverage_scan_dwell_sec: 0.65
coverage_candidate_hold_sec: 1.2
coverage_scan_max_dwell_sec: 2.0
coverage_scan_pose_timeout_sec: 0.5
coverage_goal_soft_timeout_sec: 25.0
coverage_goal_hard_timeout_sec: 40.0
coverage_goal_progress_window_sec: 5.0
coverage_goal_min_progress: 0.03
coverage_rotation_watchdog_window_sec: 5.0
coverage_rotation_min_progress: 0.03
coverage_rotation_max_yaw_deg: 90.0
coverage_goal_retry_count: 1
coverage_anchor_position_tolerance: 0.15
coverage_anchor_yaw_tolerance_deg: 3.44
coverage_anchor_yaw_hold_sec: 0.5
coverage_anchor_yaw_timeout_sec: 20.0

# 仿真独立 ROS Master，通过 TCP 协同。
sim_bridge_port: 26003
sim_timeout_sec: 900.0

# 交通灯坐标必须经实车标定后显式设置。未设置时流程安全暂停。
traffic_pose_configured: false
traffic_x: 0.0
traffic_y: 0.0
traffic_yaw: 0.0
traffic_timeout_sec: 180.0

track_timeout_sec: 420.0
status_topic: /competition/status
task1_result_topic: /competition/task1_result
